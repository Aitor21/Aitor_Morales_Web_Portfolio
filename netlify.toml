# aitormorales.com — served by Netlify from this repo's root.
# The v1 site lived here until the v3 rebuild; it is preserved on the
# `archive/v1-site` branch and the `v1-site` tag.

[build]
  publish = "."

# Netlify's "pretty URLs" post-processing rewrites every internal href from
# ./about.html to /about. Combined with the forced 301s below (which send /about
# straight back to /about.html) that made every English navigation pay a redirect,
# while the localized pages did not, because those rules only cover English. Two
# URL spellings for one page is also what broke the back button once already.
#
# Off, so links are emitted exactly as authored and match the canonical, the
# sitemap and the hreflang tags. The 301s stay as the safety net for extensionless
# URLs that are already indexed or bookmarked.
[build.processing.html]
  pretty_urls = false

# ---------------------------------------------------------------------------
# One host. The site is also reachable at its netlify.app address, a full copy
# of the portfolio under another name; it goes to the real domain. Deploy
# previews and permalinks (<id>--…netlify.app) are other hosts and keep working.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://aitormorales.netlify.app/*"
  to = "https://aitormorales.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Old v1 URLs. /about.html still exists in v3, but the projects page is gone,
# so anything pointing at it (links, bookmarks, search results) is sent to the
# case study that replaced it rather than dying on a 404.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/blasterbuds"
  to = "/projects/blaster-buds.html"
  status = 301
  force = true

[[redirects]]
  from = "/blasterbuds.html"
  to = "/projects/blaster-buds.html"
  status = 301
  force = true

# The v1 tree shipped a résumé PDF here. It is gone, and it was a stale copy of
# an already-public document, so send anyone holding the old URL to the current one.
[[redirects]]
  from = "/assets/img/Aitor_Morales_Resume.pdf"
  to = "/Aitor_Morales_Resume.pdf"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# One URL per page. Netlify serves both /about and /about.html with a 200, so
# Google was indexing them independently — and holding a stale pre-rebuild copy
# on the extensionless one. rel=canonical is only a hint; these 301s enforce it.
# `force` is required, otherwise static file resolution wins and the rule never runs.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/resume"
  to = "/resume.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/gimica"
  to = "/projects/gimica.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/blaster-buds"
  to = "/projects/blaster-buds.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/love-at-first-bite"
  to = "/projects/love-at-first-bite.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/birds-of-a-feather"
  to = "/projects/birds-of-a-feather.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/r4d10head"
  to = "/projects/r4d10head.html"
  status = 301
  force = true

[[redirects]]
  from = "/projects/viktors-mayhem"
  to = "/projects/viktors-mayhem.html"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Caching. Fingerprinted or never-changing assets can be cached hard; HTML must
# always revalidate so a deploy is visible immediately.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/font/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# css/js are busted with ?v= on every reference, so they are safe to pin too
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Prerendering was removed when the site took navigation into its own hands.
# It existed to hide the load behind a cross-document view transition; v3.js now
# fetches the next page and swaps it in without unloading the document, so that
# navigation never happens. Leaving the rules in place meant hovering a link
# prerendered the whole destination (markup, CSS, images, script execution) AND
# the swap fetched the same HTML a moment later — paying twice, on mobile data,
# for a page load that no longer occurs. The hover prefetch in v3.js is the same
# trigger at a fraction of the cost.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Security. Everything is same-origin except the click-to-play facades, both
# injected on demand by v3.js: the YouTube trailer (youtube-nocookie) and the
# itch.io playable-game embed (itch.io, which serves the build from itch.zone).
# style 'unsafe-inline' is required by the style="--i:n" stagger attributes;
# scripts stay 'self'-only. The grain texture is a data: SVG, hence img-src data:.
# GoatCounter (cookieless analytics, see v3.js) receives its hits as a beacon
# (connect-src) or, on old browsers, an image request (img-src). No script loads from it.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com https://itch.io https://*.itch.zone; connect-src 'self' https://*.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"

# ---------------------------------------------------------------------------
# Localized 404s. Netlify only ever serves /404.html on its own, so a broken
# link inside /es/ showed the English page. These rules are not forced, so they
# only apply when no file exists at the requested path.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/es/*"
  to = "/es/404.html"
  status = 404

[[redirects]]
  from = "/fr/*"
  to = "/fr/404.html"
  status = 404

[[redirects]]
  from = "/de/*"
  to = "/de/404.html"
  status = 404

[[redirects]]
  from = "/it/*"
  to = "/it/404.html"
  status = 404

[[redirects]]
  from = "/pt/*"
  to = "/pt/404.html"
  status = 404
