# aitormorales.com — served by Netlify from this repo's root.
# The v1 site lived here until the v3 rebuild; it is preserved on the
# `archive/v1-site` branch and the `v1-site` tag.

[build]
  publish = "."

# ---------------------------------------------------------------------------
# Old v1 URLs. /about.html still exists in v3, but the projects page is gone,
# so anything pointing at it (links, bookmarks, search results) is sent to the
# case study that replaced it rather than dying on a 404.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/blasterbuds"
  to = "/projects/blaster-buds.html"
  status = 301
  force = true

[[redirects]]
  from = "/blasterbuds.html"
  to = "/projects/blaster-buds.html"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Caching. Fingerprinted or never-changing assets can be cached hard; HTML must
# always revalidate so a deploy is visible immediately.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/font/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# css/js are busted with ?v= on every reference, so they are safe to pin too
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Security. Everything is same-origin except the click-to-play YouTube facade
# (youtube-nocookie iframe, injected on demand by v3.js). style 'unsafe-inline'
# is required by the style="--i:n" stagger attributes; scripts stay 'self'-only.
# The grain texture is a data: SVG, hence img-src data:.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"
